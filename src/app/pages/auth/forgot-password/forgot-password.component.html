<section class="mt-3 relative px-4 sm:px-6 md:px-8 lg:px-12 overflow-visible min-h-[calc(100vh-120px)] lg:pb-[100px] pb-16 bg-background-1 dark:bg-background-8">
  <div class="max-w-[1920px] mx-auto relative">
    <div class="hero-spheres" aria-hidden="true">
      <div class="hero-sphere hero-sphere--1"></div>
      <div class="hero-sphere hero-sphere--2"></div>
      <div class="hero-sphere hero-sphere--3"></div>
    </div>

    <div #forgotParallax class="relative z-10 bg-[url('/assets/images/home-page-14/hero-bg.svg')] dark:bg-[url('/assets/images/home-page-14/hero-bg-dark.svg')] rounded-t-[12px] md:rounded-t-[20px] rounded-b-[20px] md:rounded-b-[30px] lg:rounded-b-[40px] bg-cover bg-no-repeat overflow-hidden">
      <div class="main-container relative z-10 py-16 lg:py-24">
        <!-- Bouton retour -->
        <div class="mb-6 px-4 sm:px-6 md:px-8 lg:px-12">
          <button
            type="button"
            class="!flex !items-center !justify-center size-10 bg-background-2 dark:bg-background-7 text-secondary dark:text-accent rounded-full hover:bg-background-3 dark:hover:bg-background-6 transition-colors duration-200 overflow-hidden"
            matRipple
            [matRippleColor]="'rgba(0, 0, 0, 0.1)'"
            routerLink="/login"
          >
            <mat-icon class="!w-5 !h-5 !text-[20px] !leading-5">arrow_back</mat-icon>
          </button>
        </div>

        <div class="flex flex-col lg:grid lg:grid-cols-5 items-start gap-10">
          <div class="lg:col-span-2 w-full space-y-4 text-center lg:text-left">
            <p class="text-xs uppercase tracking-[0.2em] text-secondary/60 dark:text-accent/60">Sécurité</p>
            <h1 class="md:hidden max-w-[976px] mx-auto mb-4 text-xl sm:text-2xl leading-tight">
              Réinitialiser votre <span class="text-primary-500 dark:text-ns-green-light">mot de passe</span>
            </h1>
            <h1 class="hidden md:block max-w-[976px] md:w-full mx-auto lg:mx-0 mb-4 text-xl md:text-2xl lg:text-3xl" style="word-break: keep-all; hyphens: none; line-height: 1.3;">
              Réinitialiser votre <span class="text-primary-500 dark:text-ns-green-light" style="white-space: nowrap;">mot de passe</span>
            </h1>
            <p class="text-secondary/80 dark:text-accent/80 leading-relaxed max-w-xl mx-auto lg:mx-0">
              Entrez votre email et nous vous enverrons un lien pour créer un nouveau mot de passe.
            </p>
          </div>

          <div class="lg:col-span-3 w-full">
            <div class="login-card bg-white/80 dark:bg-background-8/80 border border-stroke-2 dark:border-stroke-6 rounded-2xl shadow-sm">
              <div class="login-header">
                <h1 class="login-title">Mot de passe oublié</h1>
                <p class="login-subtitle">
                  Recevez un lien de réinitialisation
                </p>
              </div>

              <form (ngSubmit)="onSubmit()" class="login-form">
                <div class="form-group">
                  <label for="email" class="form-label">Email</label>
                  <input
                    type="email"
                    id="email"
                    name="email"
                    [(ngModel)]="email"
                    required
                    [disabled]="loading"
                    class="form-input"
                    placeholder="votre@email.com"
                    autocomplete="email"
                  />
                </div>

                <button
                  type="submit"
                  [disabled]="loading"
                  matRipple
                  [matRippleColor]="rippleColor"
                  class="btn btn-lg btn-primary w-full disabled:opacity-50 disabled:cursor-not-allowed"
                >
                  Envoyer le lien
                </button>
              </form>

              <div class="login-footer">
                <p class="login-footer-text">
                  <a routerLink="/login" class="login-footer-link">
                    Retour à la connexion
                  </a>
                </p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
