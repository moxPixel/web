<section class="ui-auth-page">
  <div class="ui-auth-page__wrap">
    <div class="ui-auth-page__center">
      <div class="ui-auth-page__panel" role="region" aria-label="Mot de passe oublié">
        <div class="ui-auth-page__panel-back-row">
          <button uiButton variant="ghost" type="button" class="ui-auth-page__back ui-icon-button" [routerLink]="['/login']">
            <app-tabler-icon name="arrow-left" [size]="20"></app-tabler-icon>
          </button>
        </div>

        <div class="ui-auth-page__head">
          <h1 class="ui-auth-page__title">Mot de passe oublié</h1>
          <p class="ui-auth-page__subtitle">Entrez votre email et recevez un lien de réinitialisation.</p>
        </div>

        <form (ngSubmit)="onSubmit()" class="ui-auth-page__form">
          <div class="ui-auth-page__group">
            <label for="email" class="ui-auth-page__label">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              [(ngModel)]="email"
              required
              [disabled]="loading"
              uiInput
              placeholder="votre@email.com"
              autocomplete="email"
            />
          </div>

          <button type="submit" [loading]="loading" [disabled]="loading" uiButton variant="primary" class="ui-auth-page__submit">
            <span>Envoyer le lien</span>
            <app-tabler-icon name="arrow-right" [size]="18"></app-tabler-icon>
          </button>
        </form>

        <div class="ui-auth-page__foot">
          <a routerLink="/login" class="ui-auth-page__link">Retour à la connexion</a>
        </div>
      </div>
    </div>
  </div>
</section>
