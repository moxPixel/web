<section class="ui-bo-sub">
  <div class="ui-bo-sub__hero ui-container">
    <div class="ui-bo-sub__back-row">
      <button uiButton variant="ghost" type="button" class="ui-bo-sub__back ui-icon-button" [routerLink]="['/backoffice']">
        <app-tabler-icon name="arrow-left" [size]="20"></app-tabler-icon>
      </button>
    </div>

    <div class="ui-bo-sub__head">
      <div class="ui-bo-sub__pill">Backoffice</div>
      <div class="ui-bo-sub__head-row">
        <div>
          <h1 class="ui-bo-sub__h1">Utilisateurs</h1>
          <p class="ui-bo-sub__p">Comptes, rôles et statuts. Total : {{ total || 0 }}</p>
        </div>
        <div class="ui-bo-sub__head-actions">
          <button uiButton variant="ghost" type="button" (click)="load()">Actualiser</button>
        </div>
      </div>
    </div>
  </div>

  <div class="ui-container">
    <div class="ui-bo-sub__toolbar">
      <div class="ui-bo-filterbar">
        <!-- Recherche (ligne 1) -->
        <div class="ui-bo-filterbar__search">
          <label class="ui-bo-sub__label" for="bo-user-search">Recherche</label>
          <input
            uiInput
            id="bo-user-search"
            type="text"
            [(ngModel)]="search"
            placeholder="Email, prénom, nom…"
            (ngModelChange)="scheduleLoad()"
            (keyup.enter)="load()"
          />
        </div>

        <!-- Actions (ligne 2) -->
        <div class="ui-bo-filterbar__row" aria-label="Actions filtres utilisateurs">
          <div class="ui-bo-filterbar__actions">
            <button
              uiButton
              variant="ghost"
              type="button"
              #filtersBtn
              (click)="toggleFilters(filtersBtn)"
              aria-haspopup="dialog"
              [attr.aria-expanded]="filtersOpen"
            >
              <app-tabler-icon name="stack" [size]="18"></app-tabler-icon>
              <span>Filtres</span>
              <span *ngIf="activeFiltersCount()" class="ui-bo-filters__count">({{ activeFiltersCount() }})</span>
            </button>
            <button uiButton variant="ghost" type="button" class="ui-bo-sub__clear" (click)="clearFilters()" [disabled]="!activeFiltersCount()">
              Réinitialiser
            </button>
          </div>
        </div>
      </div>

    </div>

    <!-- Filters popover (avoids horizontal scrolling, keeps UI clean) -->
    <app-anchored-panel
      [open]="filtersOpen"
      [anchor]="filtersAnchor"
      [width]="440"
      preferredPlacement="bottom-end"
      panelClass="ui-anchored-panel__panel--sheet"
      (backdropClick)="closeFilters()"
      (escapeKey)="closeFilters()"
    >
      <div class="ui-bo-filters-sheet">
        <div class="ui-bo-filters-sheet__head">
          <div class="ui-bo-filters-sheet__title">Filtres</div>
          <button uiButton variant="ghost" type="button" class="ui-icon-button" (click)="closeFilters()" aria-label="Fermer">
            <app-tabler-icon name="x" [size]="18"></app-tabler-icon>
          </button>
        </div>

        <div class="ui-bo-filters-sheet__body">
          <div class="ui-bo-filters-sheet__group">
            <div class="ui-bo-filters-sheet__label">Rôle</div>
            <app-ui-choice-group
              [(ngModel)]="role"
              (ngModelChange)="scheduleLoad()"
              name="bo-user-role"
              [options]="roleOptions"
              ariaLabel="Filtre rôle"
              size="sm"
            ></app-ui-choice-group>
          </div>

          <div class="ui-bo-filters-sheet__group">
            <div class="ui-bo-filters-sheet__label">Statut</div>
            <app-ui-choice-group
              [(ngModel)]="status"
              (ngModelChange)="scheduleLoad()"
              name="bo-user-status"
              [options]="statusOptions"
              ariaLabel="Filtre statut"
              size="sm"
            ></app-ui-choice-group>
          </div>
        </div>

        <div class="ui-bo-filters-sheet__foot">
          <button uiButton variant="ghost" type="button" (click)="clearFilters(); closeFilters()" [disabled]="!activeFiltersCount()">
            Réinitialiser
          </button>
          <button uiButton variant="primary" type="button" (click)="closeFilters()">OK</button>
        </div>
      </div>
    </app-anchored-panel>

    <div class="ui-bo-sub__list-wrap">
      <div *ngIf="hasLoaded && !users.length" class="ui-bo-sub__empty">
        <div class="ui-bo-sub__muted">Aucun utilisateur trouvé.</div>
      </div>

      <div class="ui-bo-table" *ngIf="users.length">
        <div class="ui-bo-table__head ui-bo-table__head--users" aria-hidden="true">
          <div class="ui-bo-table__col ui-bo-table__col--main">Utilisateur</div>
          <div class="ui-bo-table__col ui-bo-table__col--meta">Email</div>
          <div class="ui-bo-table__col ui-bo-table__col--meta">Rôle</div>
          <div class="ui-bo-table__col ui-bo-table__col--status">Statut</div>
          <div class="ui-bo-table__col ui-bo-table__col--meta">Créé</div>
          <div class="ui-bo-table__col ui-bo-table__col--actions"></div>
        </div>

        <div class="ui-bo-row ui-bo-row--users" *ngFor="let u of users" role="row">
          <div class="ui-bo-table__col ui-bo-table__col--main">
            <div class="ui-bo-row__title">{{ displayName(u) }}</div>
            <div class="ui-bo-row__sub">ID: <span class="ui-bo-row__mono">{{ u.id }}</span></div>
          </div>

          <div class="ui-bo-table__col ui-bo-table__col--meta">
            <div class="ui-bo-row__mono">{{ u.email }}</div>
          </div>

          <div class="ui-bo-table__col ui-bo-table__col--meta">
            <div class="ui-bo-row__sub">{{ badgeRole(u.role) }}</div>
          </div>

          <div class="ui-bo-table__col ui-bo-table__col--status">
            <span class="ui-bo-sub__status" [class.is-draft]="statusClass(u.status)==='is-draft'" [class.is-archived]="statusClass(u.status)==='is-archived'">
              {{ badgeStatus(u.status) }}
            </span>
          </div>

          <div class="ui-bo-table__col ui-bo-table__col--meta">
            <div class="ui-bo-row__mono">{{ fmtDate(u.createdAt) }}</div>
          </div>

          <div class="ui-bo-table__col ui-bo-table__col--actions ui-bo-row__actions" role="cell">
            <button
              uiButton
              variant="ghost"
              type="button"
              class="ui-icon-button"
              (click)="updateStatus(u, statusQuickOptions[0].value)"
              [disabled]="(u.status || '').toLowerCase() === 'active'"
              aria-label="Activer"
              title="Activer"
            >
              <app-tabler-icon name="check" [size]="18"></app-tabler-icon>
            </button>
            <button
              uiButton
              variant="ghost"
              type="button"
              class="ui-icon-button"
              (click)="updateStatus(u, statusQuickOptions[1].value)"
              [disabled]="(u.status || '').toLowerCase() === 'suspended'"
              aria-label="Suspendre"
              title="Suspendre"
            >
              <app-tabler-icon name="x" [size]="18"></app-tabler-icon>
            </button>
            <button uiButton variant="ghost" type="button" class="ui-icon-button" (click)="deleteUser(u)" aria-label="Supprimer" title="Supprimer">
              <app-tabler-icon name="trash" [size]="18"></app-tabler-icon>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
