<div class="space-y-6">
  <!-- Header avec bouton retour -->
  <div class="flex items-center gap-4 mb-4">
    <button
      (click)="router.navigate(['/bo/certifications'])"
      mat-icon-button
      class="!flex !items-center !justify-center size-10 bg-background-2 dark:bg-background-6 text-secondary dark:text-accent rounded-full hover:bg-background-3 dark:hover:bg-background-5 transition-colors duration-200 !p-0 overflow-hidden"
      matRipple
      [matRippleColor]="'rgba(0, 0, 0, 0.1)'"
      title="Retour à la liste"
    >
      <mat-icon class="!w-5 !h-5 !text-[20px] !leading-5">arrow_back</mat-icon>
    </button>
    <div>
      <h2 class="text-2xl font-bold text-secondary dark:text-accent">{{ isEdit ? 'Modifier une certification' : 'Créer une certification' }}</h2>
      <p class="text-sm text-secondary/70 dark:text-accent/70 mt-1">Remplissez les informations ci-dessous pour {{ isEdit ? 'modifier' : 'créer' }} une certification.</p>
    </div>
  </div>

  <!-- Header avec titre et actions -->
  <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 pb-4 border-b border-stroke-2 dark:border-stroke-6">
    <div></div>
    <div class="flex gap-3">
      <button 
        matRipple 
        [matRippleColor]="'rgba(0, 0, 0, 0.1)'" 
        class="btn btn-lg px-6 h-11 rounded-full border-2 border-secondary dark:border-white text-secondary dark:text-white hover:bg-secondary hover:text-white dark:hover:bg-white dark:hover:text-secondary transition-all" 
        (click)="cancel()">
        Annuler
      </button>
      <button 
        matRipple 
        [matRippleColor]="'rgba(255, 255, 255, 0.3)'" 
        [disabled]="saving"
        class="btn btn-lg px-6 h-11 rounded-full bg-secondary text-white hover:bg-secondary/90 border-0 dark:bg-white dark:text-secondary transition-all disabled:opacity-50 disabled:cursor-not-allowed" 
        (click)="save()">
        <span *ngIf="!saving">Enregistrer</span>
        <span *ngIf="saving" class="flex items-center gap-2">
          <svg class="animate-spin h-4 w-4" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          Enregistrement...
        </span>
      </button>
    </div>
  </div>

  <form [formGroup]="form" class="space-y-6">
    <!-- Section 1 : Informations générales -->
    <div class="space-y-5 border-b border-stroke-2 dark:border-stroke-6 pb-6 mb-6">
      <div class="flex items-center gap-3 pb-3 border-b border-stroke-2 dark:border-stroke-6">
        <span class="inline-flex items-center justify-center w-8 h-8 rounded-full bg-secondary text-white text-sm font-bold dark:bg-white dark:text-secondary">1</span>
        <h3 class="text-xl font-semibold text-secondary dark:text-accent">Informations générales</h3>
      </div>
      
      <div class="space-y-4">
        <div class="form-group">
          <label class="required">Type de certification</label>
          <div class="option-selector">
            <label class="option-option" [class.selected]="isRNCP">
              <input 
                type="radio" 
                formControlName="type" 
                value="RNCP" 
                class="option-input"
              />
              <span class="option-label">RNCP</span>
            </label>
            <label class="option-option" [class.selected]="isRS">
              <input 
                type="radio" 
                formControlName="type" 
                value="RS" 
                class="option-input"
              />
              <span class="option-label">RS</span>
            </label>
            <label class="option-option" [class.selected]="isOther">
              <input 
                type="radio" 
                formControlName="type" 
                value="Other" 
                class="option-input"
              />
              <span class="option-label">Autre</span>
            </label>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div class="form-group">
            <label class="required">Code</label>
            <input 
              class="form-input" 
              formControlName="code" 
              placeholder="Ex: RNCP12345"
              [class.error]="form.get('code')?.invalid && form.get('code')?.touched"
            />
            <div *ngIf="form.get('code')?.invalid && form.get('code')?.touched" class="text-red-600 dark:text-red-400 text-sm mt-1">
              Le code est requis
            </div>
          </div>
          <div class="form-group">
            <label class="required">Titre</label>
            <input 
              class="form-input" 
              formControlName="title" 
              placeholder="Ex: Titre Professionnel Consultant en Intelligence Artificielle"
              [class.error]="form.get('title')?.invalid && form.get('title')?.touched"
            />
            <div *ngIf="form.get('title')?.invalid && form.get('title')?.touched" class="text-red-600 dark:text-red-400 text-sm mt-1">
              Le titre est requis
            </div>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div class="form-group">
            <label>Niveau</label>
            <input 
              class="form-input" 
              formControlName="level" 
              placeholder="Ex: Niveau 6 (Bac+3/4)"
            />
          </div>
          <div class="form-group">
            <label>Organisme certificateur</label>
            <input 
              class="form-input" 
              formControlName="issuer" 
              placeholder="Ex: France Compétences"
            />
          </div>
        </div>

        <div class="form-group">
          <label>Description</label>
          <textarea 
            class="form-textarea" 
            formControlName="description" 
            placeholder="Description de la certification..."
            rows="4"
          ></textarea>
        </div>
      </div>
    </div>

    <!-- Section 2 : Statut -->
    <div class="space-y-5 border-b border-stroke-2 dark:border-stroke-6 pb-6 mb-6 last:border-b-0">
      <div class="flex items-center gap-3 pb-3 border-b border-stroke-2 dark:border-stroke-6">
        <span class="inline-flex items-center justify-center w-8 h-8 rounded-full bg-secondary text-white text-sm font-bold dark:bg-white dark:text-secondary">2</span>
        <h3 class="text-xl font-semibold text-secondary dark:text-accent">Statut</h3>
      </div>
      
      <div class="space-y-4">
        <div class="form-group">
          <label>Statut</label>
          <div class="option-selector">
            <label class="option-option" [class.selected]="form.get('status')?.value === 'active'">
              <input 
                type="radio" 
                formControlName="status" 
                value="active" 
                class="option-input"
              />
              <span class="option-label">Active</span>
            </label>
            <label class="option-option" [class.selected]="form.get('status')?.value === 'inactive'">
              <input 
                type="radio" 
                formControlName="status" 
                value="inactive" 
                class="option-input"
              />
              <span class="option-label">Inactive</span>
            </label>
          </div>
        </div>
      </div>
    </div>
  </form>

  <!-- Footer avec actions -->
  <div class="sticky bottom-0 border-t border-stroke-2 dark:border-stroke-6 p-4 -mx-6 -mb-6 mt-8 flex items-center justify-end gap-3">
    <button 
      matRipple 
      [matRippleColor]="'rgba(0, 0, 0, 0.1)'" 
      class="btn btn-lg px-6 h-11 rounded-full border-2 border-secondary dark:border-white text-secondary dark:text-white hover:bg-secondary hover:text-white dark:hover:bg-white dark:hover:text-secondary transition-all" 
      (click)="cancel()">
      Annuler
    </button>
    <button 
      matRipple 
      [matRippleColor]="'rgba(255, 255, 255, 0.3)'" 
      class="btn btn-lg px-6 h-11 rounded-full bg-secondary text-white hover:bg-secondary/90 border-0 dark:bg-white dark:text-secondary transition-all disabled:opacity-50 disabled:cursor-not-allowed" 
      [disabled]="saving"
      (click)="save()">
      <span *ngIf="!saving">Enregistrer</span>
      <span *ngIf="saving" class="flex items-center gap-2">
        <svg class="animate-spin h-4 w-4" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        Enregistrement...
      </span>
    </button>
  </div>
</div>
