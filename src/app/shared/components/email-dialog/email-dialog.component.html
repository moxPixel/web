<div
  class="fixed inset-0 z-[999] flex items-center justify-center px-4 md:px-0"
  *ngIf="open"
>
  <div class="absolute inset-0 bg-black/40 backdrop-blur-sm" (click)="emitClose()" matRipple></div>

  <div
    class="relative w-full max-w-2xl bg-background-1 dark:bg-background-8 text-secondary dark:text-accent rounded-2xl shadow-2xl border border-stroke-2 dark:border-stroke-6 overflow-hidden"
  >
    <!-- Header -->
    <div class="flex items-center justify-between px-5 py-4 border-b border-stroke-2 dark:border-stroke-6 bg-background-2/70 dark:bg-background-7/70">
      <div class="flex items-center gap-2">
        <span class="text-base font-semibold">Nouveau message</span>
        <span class="text-xs px-2 py-1 rounded-full bg-primary-50 dark:bg-ns-green-light/15 text-primary-600 dark:text-ns-green-light">Mail</span>
      </div>
      <button
        type="button"
        matRipple
        [matRippleColor]="'rgba(0,0,0,0.08)'"
        class="size-9 rounded-full flex items-center justify-center text-secondary/70 dark:text-accent/70 hover:bg-background-3 dark:hover:bg-background-6 transition-colors"
        (click)="emitClose()"
      >
        <mat-icon class="!w-5 !h-5 !text-[20px]">close</mat-icon>
      </button>
    </div>

    <!-- Body -->
    <div class="px-5 py-4 space-y-3">
      <div class="flex items-center gap-3">
        <span class="text-sm text-secondary/70 dark:text-accent/70 w-16 shrink-0">À</span>
        <input
          type="email"
          class="flex-1 bg-transparent border border-stroke-2 dark:border-stroke-6 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-primary-500 dark:focus:ring-ns-green-light focus:border-primary-500 dark:focus:border-ns-green-light"
          placeholder="destinataire@example.com"
          [ngModel]="to()"
          (ngModelChange)="to.set($event)"
        />
      </div>

      <div class="flex items-center gap-3">
        <span class="text-sm text-secondary/70 dark:text-accent/70 w-16 shrink-0">Cc</span>
        <input
          type="text"
          class="flex-1 bg-transparent border border-stroke-2 dark:border-stroke-6 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-primary-500 dark:focus:ring-ns-green-light focus:border-primary-500 dark:focus:border-ns-green-light"
          placeholder="copie@example.com"
          [ngModel]="cc()"
          (ngModelChange)="cc.set($event)"
        />
      </div>

      <div class="flex items-center gap-3">
        <span class="text-sm text-secondary/70 dark:text-accent/70 w-16 shrink-0">Objet</span>
        <input
          type="text"
          class="flex-1 bg-transparent border border-stroke-2 dark:border-stroke-6 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-primary-500 dark:focus:ring-ns-green-light focus:border-primary-500 dark:focus:border-ns-green-light"
          placeholder="Sujet du message"
          [ngModel]="subject()"
          (ngModelChange)="subject.set($event)"
        />
      </div>

      <div>
        <textarea
          rows="8"
          class="w-full bg-transparent border border-stroke-2 dark:border-stroke-6 rounded-lg px-3 py-3 text-sm outline-none focus:ring-2 focus:ring-primary-500 dark:focus:ring-ns-green-light focus:border-primary-500 dark:focus:border-ns-green-light"
          placeholder="Écrire votre message..."
          [ngModel]="message()"
          (ngModelChange)="message.set($event)"
        ></textarea>
      </div>
    </div>

    <!-- Footer -->
    <div class="px-5 py-4 flex items-center justify-between bg-background-2/70 dark:bg-background-7/70 border-t border-stroke-2 dark:border-stroke-6">
      <div class="flex items-center gap-2">
        <button
          type="button"
          matRipple
          [matRippleColor]="'rgba(0,0,0,0.1)'"
          class="btn px-5 h-11 rounded-full bg-secondary text-white hover:bg-secondary/90 border-0 dark:bg-white dark:text-secondary transition-all flex items-center gap-2"
          [disabled]="loading"
          (click)="emitSend()"
        >
          <mat-icon class="!w-[18px] !h-[18px] !text-[18px] !leading-[18px] flex-shrink-0">send</mat-icon>
          <span>{{ loading ? 'Envoi...' : 'Envoyer' }}</span>
        </button>

        <button
          type="button"
          matRipple
          [matRippleColor]="'rgba(0,0,0,0.08)'"
          class="size-10 rounded-full flex items-center justify-center text-secondary/70 dark:text-accent/70 hover:bg-background-3 dark:hover:bg-background-6 transition-colors"
          title="Joindre un fichier"
          (click)="fileInput.click()"
        >
          <mat-icon class="!w-5 !h-5 !text-[20px]">attach_file</mat-icon>
        </button>
        <input #fileInput type="file" class="hidden" (change)="onFilesSelected($event)" />
      </div>

      <button
        type="button"
        matRipple
        [matRippleColor]="'rgba(0,0,0,0.08)'"
        class="text-sm text-secondary/70 dark:text-accent/70 hover:text-secondary dark:hover:text-accent px-3 py-2 rounded-lg"
        (click)="emitClose()"
        [disabled]="loading"
      >
        Fermer
      </button>
    </div>

    <div *ngIf="attachments().length" class="px-5 pb-4 flex items-center gap-2 text-xs text-secondary/70 dark:text-accent/70">
      <mat-icon class="!w-4 !h-4 !text-[16px] !leading-4">attach_file</mat-icon>
      <span class="truncate">{{ attachments()[0].filename }}</span>
      <button type="button" class="text-primary-500 dark:text-ns-green-light text-[11px]" (click)="clearAttachment()">Retirer</button>
    </div>
  </div>
</div>
