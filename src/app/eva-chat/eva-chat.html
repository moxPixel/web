<!-- Bouton flottant en bas à gauche - apparaît au scroll -->
<a
  #chatButton
  routerLink="/contact"
  matRipple
  [matRippleColor]="'rgba(255, 255, 255, 0.3)'"
  class="btn bg-secondary text-white hover:bg-secondary/90 border-0 dark:bg-white dark:text-secondary px-4 h-10 gap-2 cursor-pointer text-sm rounded-full shadow-lg hover:shadow-xl transition-shadow flex items-center justify-center"
  style="position: fixed; bottom: 1.5rem; left: 1.5rem; z-index: 9999;"
  aria-label="Aller à la page contact"
>
  <mat-icon style="font-size: 18px; width: 18px; height: 18px;">auto_awesome</mat-icon>
  <span>Besoin d'aide ?</span>
</a>
