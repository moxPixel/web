<section class="mt-3 relative px-4 sm:px-6 md:px-8 lg:px-12 overflow-visible">
  <div class="max-w-[1920px] mx-auto relative">
    <div class="main-container py-12 md:py-16 space-y-8">
      <div class="space-y-3 text-center">
        <span class="badge badge-green">Avis clients</span>
        <h2 class="text-3xl md:text-4xl font-bold">
          Ils recommandent <span class="text-primary-500 dark:text-ns-green-light">Unlock</span>
        </h2>
        <p class="text-gray-700 dark:text-gray-300 max-w-3xl mx-auto">
          Extraits d’avis 5★ Trustpilot sur nos formations IA, cybersécurité et data.
        </p>
      </div>

      <div class="space-y-6">
        <ng-container *ngFor="let review of reviews">
          <div class="grid grid-cols-1 md:grid-cols-5 gap-4 md:gap-6 items-start">
            <div class="md:col-span-2 flex flex-col gap-1 text-sm text-gray-500 dark:text-gray-400">
              <span class="font-semibold text-secondary dark:text-white text-base">{{ review.author }}</span>
              <span>{{ review.date }} · {{ review.source }}</span>
              <div class="flex items-center gap-1 text-amber-500">
                <ng-container *ngFor="let _ of [].constructor(review.rating)">
                  <span>★</span>
                </ng-container>
              </div>
            </div>
            <div class="md:col-span-3 space-y-2">
              <h3 class="font-semibold text-lg text-secondary dark:text-white">{{ review.title }}</h3>
              <p class="text-gray-700 dark:text-gray-200 leading-relaxed italic">
                “{{ review.content }}”
              </p>
            </div>
          </div>
          <div class="h-px bg-stroke-2 dark:bg-stroke-6 last:hidden"></div>
        </ng-container>

        <div class="pt-2 flex justify-center">
          <a
            href="https://fr.trustpilot.com/review/unlock-technologies.fr?stars=5"
            target="_blank"
            rel="noopener"
            class="btn btn-lg px-8 h-12 flex items-center justify-center gap-2 border-2 border-secondary dark:border-white text-secondary dark:text-white hover:bg-secondary hover:text-white dark:hover:bg-white dark:hover:text-secondary transition-all"
          >
            <span>Voir tous les avis</span>
            <mat-icon class="!w-[18px] !h-[18px] !text-[18px] !leading-[18px] flex-shrink-0">arrow_forward</mat-icon>
          </a>
        </div>
      </div>
    </div>
  </div>
</section>
