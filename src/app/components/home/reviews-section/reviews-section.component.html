<section class="ui-reviews ui-home-section" data-ui-section="reviews">
  <div class="ui-reviews__container ui-home-container">
    <header class="ui-reviews__header ui-home-header">
      <div class="ui-reviews__pill ui-home-pill">Avis clients</div>
      <h2 class="ui-reviews__title ui-home-title">
        Ils recommandent <span class="ui-reviews__title-accent ui-home-title-accent">Unlock</span>
      </h2>
      <p class="ui-reviews__lede ui-home-lede">
        Extraits d'avis 5★ Trustpilot sur nos formations IA, cybersécurité et data.
      </p>
    </header>

    <div class="ui-reviews__grid">
      <!-- Visual slot (Three.js morph target) -->
      <div class="ui-reviews__visual">
        <div class="ui-reviews__visual-frame" data-ui-morph-target="reviews-photo" aria-hidden="true"></div>
      </div>

      <!-- Reviews list -->
      <div class="ui-reviews__list">
        <ng-container *ngFor="let review of reviews; let last = last">
          <div class="ui-reviews__item">
            <div class="ui-reviews__item-meta">
              <span class="ui-reviews__item-author">{{ review.author }}</span>
              <span class="ui-reviews__item-date">{{ review.date }} · {{ review.source }}</span>
              <div class="ui-reviews__item-rating">
                <ng-container *ngFor="let _ of [].constructor(review.rating)">
                  <span class="ui-reviews__star">★</span>
                </ng-container>
              </div>
            </div>
            <div class="ui-reviews__item-content">
              <h3 class="ui-reviews__item-title">{{ review.title }}</h3>
              <p class="ui-reviews__item-text">
                "{{ review.content }}"
              </p>
            </div>
          </div>
          <div *ngIf="!last" class="ui-reviews__divider"></div>
        </ng-container>

        <div class="ui-reviews__cta">
          <a
            href="https://fr.trustpilot.com/review/unlock-technologies.fr?stars=5"
            target="_blank"
            rel="noopener"
            class="ui-button ui-button--outline ui-button--lg"
          >
            <span>Voir tous les avis</span>
            <app-tabler-icon name="arrow-right" [size]="18"></app-tabler-icon>
          </a>
        </div>
      </div>
    </div>
  </div>
</section>
