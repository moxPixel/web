<section class="ui-press ui-home-section" data-ui-section="press">
  <div class="ui-press__container ui-home-container">
    <!-- Header -->
    <header class="ui-press__header ui-home-header">
      <div class="ui-press__pill ui-home-pill">Presse</div>
      <h2 class="ui-press__title ui-home-title">
        Ils <span class="ui-press__title-accent ui-home-title-accent">parlent de nous</span>
      </h2>
    </header>

    <!-- Article layout compact -->
    <div class="ui-press__article">
      <div class="ui-press__logo-wrapper">
        <div class="ui-press__logo">
          <span class="ui-press__logo-ring">
            <img 
              [src]="pressArticle.logo" 
              [alt]="'Article Unlock Formation dans ' + pressArticle.title"
              loading="lazy"
              decoding="async"
            />
          </span>
        </div>
        
        <!-- Image supplémentaire en dessous -->
        <div class="ui-press__logo-secondary">
          <span class="ui-press__logo-ring">
            <img 
              src="/assets/images/img/g0.png" 
              alt="Unlock Formation"
              loading="lazy"
              decoding="async"
            />
          </span>
        </div>
      </div>

      <div class="ui-press__content">
        <div class="ui-press__excerpt" [innerHTML]="pressArticle.excerpt"></div>
        
        <ul class="ui-press__points">
          <li class="ui-press__point" *ngFor="let point of pressArticle.points">
            <strong class="ui-press__point-title">{{ point.title }} :</strong>
            <span class="ui-press__point-text">{{ point.text }}</span>
          </li>
        </ul>

        <div class="ui-press__cta">
          <a
            [href]="pressArticle.link"
            target="_blank"
            rel="noopener noreferrer"
            class="ui-button ui-button--outline"
          >
            <span>Lire l'article</span>
            <app-tabler-icon name="external-link" [size]="18"></app-tabler-icon>
          </a>
        </div>
      </div>
    </div>
  </div>
</section>
