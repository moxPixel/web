<section
  class="ui-cookie"
  [class.ui-cookie--visible]="isVisible"
  [class.ui-cookie--hiding]="isHiding"
  aria-live="polite"
  aria-label="Bannière de consentement aux cookies"
>
  <div class="ui-cookie__container">
    <div uiCard class="ui-cookie__panel" [padded]="false">
      <div class="ui-cookie__main">
        <div class="ui-cookie__icon" aria-hidden="true">
          <app-tabler-icon name="info-circle" [size]="18"></app-tabler-icon>
        </div>

        <div class="ui-cookie__copy">
          <div class="ui-cookie__title">Cookies</div>
          <p class="ui-cookie__text">
            Nous utilisons des cookies pour améliorer l’expérience, mesurer l’audience et sécuriser les parcours.
          </p>
          <div class="ui-cookie__links">
            <a class="ui-cookie__link" routerLink="/cgu">Politique</a>
            <span class="ui-cookie__sep" aria-hidden="true">•</span>
            <a class="ui-cookie__link" routerLink="/faq">Aide</a>
          </div>
        </div>
      </div>

      <div class="ui-cookie__actions">
        <button uiButton variant="ghost" type="button" class="ui-cookie__btn" (click)="reject()">
          Refuser
        </button>
        <button uiButton variant="primary" type="button" class="ui-cookie__btn" (click)="accept()">
          Accepter
        </button>
      </div>
    </div>
  </div>
</section>
