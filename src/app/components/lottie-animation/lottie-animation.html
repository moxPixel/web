<div [class.bubble-3d]="showBubble"
     [class.flex]="showBubble"
     [class.items-center]="showBubble"
     [class.justify-center]="showBubble"
     [class.relative]="showBubble"
     [class.overflow-visible]="showBubble"
     [style.width.px]="showBubble ? bubbleSize : null"
     [style.height.px]="showBubble ? bubbleSize : null">

  <!-- Reflets blancs uniquement (effet bulle 3D) -->
  @if (showBubble) {
    <div class="absolute top-[32%] left-[18%] w-[18%] h-[18%] rounded-full bg-white/12 blur-lg"></div>
    <div class="absolute bottom-[36%] right-[26%] w-[12%] h-[12%] rounded-full bg-white/8 blur-md"></div>
  }

  <!-- Lottie container (toujours présent) -->
  <div #lottieContainer class="lottie-container"></div>
</div>
