<!doctype html>
<html lang="fr" data-accent="primary">
<head>
  <meta charset="utf-8">
  <title>Unlock Formation</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="/assets/images/logo/logo.png">
  <link rel="apple-touch-icon" href="/assets/images/logo/logo.png">
  <meta name="description" content="Unlock Formation — Formations Tech & IA (bootcamp, alternance, certifiantes). Projets réels, mentorat, accompagnement carrière." />
  <meta name="robots" content="index,follow" />
  <meta name="theme-color" content="#050506" />

  <!-- Preload critical baked pointcloud (instant hero particles on first reveal) -->
  <!-- Runtime chooses between 45k (mobile/low-end) and 90k (desktop). -->
  <link rel="preload" href="/assets/pointclouds/45000/hero.bin" as="fetch" crossorigin />
  <link rel="preload" href="/assets/pointclouds/90000/hero.bin" as="fetch" crossorigin />

  <!-- Open Graph (fallback; Angular will update dynamically) -->
  <meta property="og:site_name" content="Unlock Formation" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Unlock Formation" />
  <meta property="og:description" content="Formations Tech & IA (bootcamp, alternance, certifiantes). Projets réels, mentorat, accompagnement carrière." />
  <meta property="og:image" content="/assets/images/logo/logo-dark.png" />

  <!-- Twitter (fallback) -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Unlock Formation" />
  <meta name="twitter:description" content="Formations Tech & IA (bootcamp, alternance, certifiantes)." />
  <meta name="twitter:image" content="/assets/images/logo/logo-dark.png" />
  <style>
    /* ------------------------------------------------------------
      Inline critical styles: show a premium loader instantly
      (before Angular + CSS bundles are ready)
    -------------------------------------------------------------*/
    :root {
      color-scheme: dark;
      --ui-bg: #050506;
      --ui-fg: #f1f1f2;
      --ui-fg-subtle: rgba(241, 241, 242, 0.55);
      --ui-glass-blur: 24px;
      --ui-glass-sat: 150%;
      --ui-glass-bg: rgba(14, 14, 16, 0.58);
      --ui-glass-bg-strong: rgba(14, 14, 16, 0.75);
      --ui-glass-border: rgba(241, 241, 242, 0.08);

      /* Nebula */
      /* Base palette (matches theme.css SSOT base to avoid color "flash") */
      --ui-nebula-accent: #eaf9ff;
      --ui-nebula-secondary: #38bdf8;
      --ui-nebula-tertiary: #070b14;
      --ui-nebula-teal: #a78bfa;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; padding: 0; background: var(--ui-bg); }

    body:not(.app-ready) { overflow: hidden; }

    /* Fullscreen loader overlay */
    #page-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: var(--ui-bg);
      opacity: 1;
      transition: opacity 600ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    #page-loader.loader-exit {
      opacity: 0;
      pointer-events: none;
    }

    /* Loader background (same spirit as app spheres) */
    #page-loader .loader-bg {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    /* Dots Pattern (same as app) */
    #page-loader .loader-pattern {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      opacity: 0.38;
      mix-blend-mode: soft-light;
    }

    #page-loader .loader-pattern-svg {
      width: 100%;
      height: 100%;
      display: block;
      color: var(--ui-nebula-accent);
      filter: saturate(110%);
    }

    #page-loader .loader-sphere {
      position: absolute;
      border-radius: 999px;
      mix-blend-mode: screen;
      will-change: transform, opacity, filter;
      pointer-events: none;
    }

    #page-loader .loader-sphere.s1 {
      width: clamp(300px, 34vw, 600px); height: clamp(300px, 34vw, 600px);
      top: -12%; right: 10%;
      background:
        radial-gradient(ellipse at 30% 35%,
          color-mix(in srgb, var(--ui-nebula-accent) 70%, transparent) 0%,
          color-mix(in srgb, var(--ui-nebula-accent) 28%, transparent) 34%,
          transparent 70%),
        radial-gradient(ellipse at 70% 68%,
          color-mix(in srgb, var(--ui-nebula-accent) 40%, transparent) 0%,
          color-mix(in srgb, var(--ui-nebula-accent) 16%, transparent) 38%,
          transparent 72%);
      opacity: 0.52;
      filter: blur(98px) saturate(115%);
      animation: loader-float-1 40s cubic-bezier(0.4,0,0.2,1) infinite;
    }
    #page-loader .loader-sphere.s2 {
      width: clamp(420px, 54vw, 940px); height: clamp(420px, 54vw, 940px);
      top: 12%; right: -6%;
      background:
        radial-gradient(ellipse at 48% 42%,
          color-mix(in srgb, var(--ui-nebula-secondary) 52%, transparent) 0%,
          color-mix(in srgb, var(--ui-nebula-secondary) 18%, transparent) 40%,
          transparent 74%),
        radial-gradient(ellipse at 60% 62%,
          color-mix(in srgb, var(--ui-nebula-accent) 22%, transparent) 0%,
          color-mix(in srgb, var(--ui-nebula-accent) 8%, transparent) 46%,
          transparent 78%);
      opacity: 0.42;
      filter: blur(120px) saturate(110%);
      animation: loader-float-2 54s cubic-bezier(0.4,0,0.2,1) infinite;
    }
    #page-loader .loader-sphere.s3 {
      width: clamp(260px, 30vw, 520px); height: clamp(260px, 30vw, 520px);
      top: 56%; right: 16%;
      background:
        radial-gradient(ellipse at 55% 40%,
          color-mix(in srgb, var(--ui-nebula-teal) 40%, transparent) 0%,
          color-mix(in srgb, var(--ui-nebula-teal) 14%, transparent) 42%,
          transparent 76%),
        radial-gradient(ellipse at 35% 70%,
          color-mix(in srgb, var(--ui-nebula-accent) 18%, transparent) 0%,
          color-mix(in srgb, var(--ui-nebula-accent) 6%, transparent) 48%,
          transparent 78%);
      opacity: 0.34;
      filter: blur(92px) saturate(110%);
      animation: loader-float-3 46s cubic-bezier(0.4,0,0.2,1) infinite;
    }
    #page-loader .loader-sphere.s4 {
      width: clamp(220px, 22vw, 420px); height: clamp(220px, 22vw, 420px);
      top: 8%; right: 26%;
      background:
        radial-gradient(ellipse at 40% 48%,
          color-mix(in srgb, var(--ui-nebula-tertiary) 26%, transparent) 0%,
          color-mix(in srgb, var(--ui-nebula-tertiary) 9%, transparent) 44%,
          transparent 78%),
        radial-gradient(ellipse at 62% 62%,
          color-mix(in srgb, var(--ui-nebula-accent) 10%, transparent) 0%,
          transparent 70%);
      opacity: 0.22;
      filter: blur(84px) saturate(105%);
      animation: loader-float-4 62s cubic-bezier(0.4,0,0.2,1) infinite;
    }

    /* Subtle tint overlay (like body::before in app) */
    #page-loader .loader-tint {
      position: absolute;
      inset: 0;
      background: rgba(5, 5, 6, 0.24);
      pointer-events: none;
    }

    /* Loader content (no panel / no container) */
    #page-loader .loader-content {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 24px;
      transform: translateY(6px) scale(0.99);
      opacity: 0;
      filter: blur(14px);
      animation: loader-in 700ms cubic-bezier(0.16,1,0.3,1) 120ms forwards;
      will-change: transform, opacity, filter;
    }

    /* Container for Logo + Circle Spinner */
    #page-loader .loader-spinner-wrapper {
      position: relative;
      width: 68px;
      height: 68px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #page-loader .loader-logo {
      height: 28px;
      width: auto;
      object-fit: contain;
      position: relative;
      z-index: 2;
    }

    /* Premium Circle Spinner - Clean (No BG) */
    #page-loader .loader-spinner {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      /* Transparent track */
      border: 1.5px solid transparent;
      /* Active arc */
      border-top-color: var(--ui-nebula-accent);
      /* Glow only on the line */
      filter: drop-shadow(0 0 2px var(--ui-nebula-accent));
      animation: loader-spin 1.2s cubic-bezier(0.5, 0.1, 0.4, 0.9) infinite;
    }
    
    /* Second ring (Counter-rotating) */
    #page-loader .loader-spinner::after {
      content: "";
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 1.5px solid transparent;
      border-bottom-color: var(--ui-nebula-secondary);
      opacity: 0.8;
      filter: drop-shadow(0 0 2px var(--ui-nebula-secondary));
      animation: loader-spin 1.8s cubic-bezier(0.5, 0.1, 0.4, 0.9) infinite reverse;
    }

    #page-loader .loader-text {
      font: 450 13px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial;
      color: var(--ui-fg-subtle);
      letter-spacing: -0.01em;
      text-align: center;
      margin: 0;
      margin-top: 12px;
    }

    @keyframes loader-in {
      to { opacity: 1; filter: blur(0); transform: translateY(0) scale(1); }
    }
    @keyframes loader-spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes loader-float-1 {
      0%,100% { transform: translate(0,0) scale(1); }
      50% { transform: translate(28px,-34px) scale(1.12); }
    }
    @keyframes loader-float-2 {
      0%,100% { transform: translate(0,0) scale(1); }
      50% { transform: translate(-38px,26px) scale(1.1); }
    }
    @keyframes loader-float-3 {
      0%,100% { transform: translate(0,0) scale(1); }
      50% { transform: translate(24px,32px) scale(1.16); }
    }
    @keyframes loader-float-4 {
      0%,100% { transform: translate(0,0) scale(1); }
      50% { transform: translate(-22px,18px) scale(1.12); }
    }
  </style>
</head>
<body>
  <!-- Premium loader (removed after Angular bootstraps) -->
  <div id="page-loader" aria-hidden="true">
    <div class="loader-bg">
      <div class="loader-sphere s1"></div>
      <div class="loader-sphere s2"></div>
      <div class="loader-sphere s3"></div>
      <div class="loader-sphere s4"></div>
      <div class="loader-tint"></div>
      <!-- Dots Pattern -->
      <div class="loader-pattern" aria-hidden="true">
        <svg class="loader-pattern-svg" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
          <defs>
            <!-- Masque pour fade vers les bords -->
            <mask id="loader-dots-mask">
              <radialGradient id="loader-fade-gradient" cx="50%" cy="50%" r="70%">
                <stop offset="0%" stop-color="white" stop-opacity="1"/>
                <stop offset="60%" stop-color="white" stop-opacity="0.8"/>
                <stop offset="80%" stop-color="white" stop-opacity="0.4"/>
                <stop offset="100%" stop-color="white" stop-opacity="0"/>
              </radialGradient>
              <rect width="100%" height="100%" fill="url(#loader-fade-gradient)"/>
            </mask>
            <pattern id="loader-dots-pattern" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
              <!-- Dots: even denser + MORE visible -->
              <circle cx="1" cy="1" r="0.46" fill="currentColor" opacity="0.44"/>
              <circle cx="3" cy="3" r="0.46" fill="currentColor" opacity="0.44"/>
              <circle cx="1" cy="3" r="0.34" fill="currentColor" opacity="0.28"/>
              <circle cx="3" cy="1" r="0.34" fill="currentColor" opacity="0.28"/>
            </pattern>
          </defs>
          <rect width="100%" height="100%" fill="url(#loader-dots-pattern)" mask="url(#loader-dots-mask)"/>
        </svg>
      </div>
    </div>
    <div class="loader-content">
      <div class="loader-spinner-wrapper">
        <div class="loader-spinner"></div>
        <img class="loader-logo" src="/assets/images/logo/logo-dark.png" alt="Unlock" />
      </div>
      <p class="loader-text">Patienter<br/>Nous améliorons votre expérience utilisateur</p>
    </div>
  </div>
  <app-root></app-root>
</body>
</html>
