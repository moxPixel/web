  <script>
    // Appliquer le dark mode avant le chargement d'Angular pour éviter le flash blanc
    (function() {
      const savedTheme = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

      if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
        document.documentElement.classList.add('dark');
        document.documentElement.style.backgroundColor = '#070b10';
        document.body.style.backgroundColor = '#070b10';
      } else {
        document.documentElement.classList.remove('dark');
        document.documentElement.style.backgroundColor = '#ffffff';
        document.body.style.backgroundColor = '#ffffff';
      }
    })();
  </script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html {
      background-color: #ffffff;
      transition: background-color 0.3s ease;
      margin: 0;
      padding: 0;
    }
    html.dark {
      background-color: #070b10;
    }
    body {
      background-color: #ffffff;
      transition: background-color 0.3s ease;
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }
    html.dark body {
      background-color: #070b10;
    }

    /* Page Loader - CSS inline pour chargement immédiat */
    #page-loader {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 9999;
      background-color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 1;
      transition: opacity 0.4s ease-out;
    }

    html.dark #page-loader {
      background-color: #070b10;
    }

    #page-loader.loader-exit {
      opacity: 0;
      pointer-events: none;
    }

    #page-loader .loader-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      position: relative;
      z-index: 10;
      opacity: 0;
      filter: blur(25px);
      transform: scale(0.9);
      animation: loader-deblur 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
      will-change: opacity, filter, transform;
    }

    #page-loader.loader-exit {
      opacity: 0;
      transition: opacity 0.4s ease-out;
    }

    #page-loader.loader-exit .loader-content {
      opacity: 0;
      filter: blur(20px);
      transform: scale(0.9);
      transition: opacity 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                  filter 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                  transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    #page-loader .loader-logo-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #page-loader .loader-logo-wrapper img {
      height: 2rem;
      object-fit: contain;
      animation: logo-pulse 1.5s ease-in-out infinite;
    }

    @media (min-width: 768px) {
      #page-loader .loader-logo-wrapper img {
        height: 2.5rem;
      }
    }

    #page-loader .loader-logo-wrapper img.logo-light {
      display: block;
    }

    html.dark #page-loader .loader-logo-wrapper img.logo-light {
      display: none;
    }

    #page-loader .loader-logo-wrapper img.logo-dark {
      display: none;
    }

    html.dark #page-loader .loader-logo-wrapper img.logo-dark {
      display: block;
    }

    #page-loader .loader-text {
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: 0.875rem;
      font-weight: 400;
      color: #6b7280;
      text-align: center;
      opacity: 0;
      animation: loader-text-fade 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.3s forwards;
      max-width: 280px;
      line-height: 1.5;
    }

    html.dark #page-loader .loader-text {
      color: #9ca3af;
    }

    @keyframes loader-text-fade {
      0% {
        opacity: 0;
        transform: translateY(10px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    body:not(.loader-hidden) {
      overflow: hidden;
    }

    @keyframes loader-deblur {
      0% {
        opacity: 0;
        filter: blur(25px);
        transform: scale(0.9);
      }
      100% {
        opacity: 1;
        filter: blur(0px);
        transform: scale(1);
      }
    }

    @keyframes logo-pulse {
      0%, 100% {
        transform: scale(1);
        opacity: 1;
      }
      50% {
        transform: scale(1.1);
        opacity: 0.8;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #page-loader .loader-content {
        animation: none !important;
        opacity: 1;
        filter: none !important;
        transform: none;
      }
      #page-loader .loader-logo-wrapper img {
        animation: none !important;
      }
    }
